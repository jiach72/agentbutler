<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Agent Butler C2 管家机器人">
  <title>Agent Butler C2 管家机器人 · 品牌形象</title>
  <defs>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#softGlow)">
    <!-- 顶部圆润小天线 -->
    <rect x="56" y="8" width="8" height="14" rx="4" fill="#BFE8C4"/>
    
    <!-- 左右圆润耳扣 -->
    <rect x="10" y="44" width="8" height="26" rx="4" fill="#1F242C"/>
    <rect x="102" y="44" width="8" height="26" rx="4" fill="#1F242C"/>

    <!-- 机器人方圆躯干（暖石墨深炭黑） -->
    <rect x="15" y="18" width="90" height="94" rx="30" fill="#282D34"/>

    <!-- 标志性宽弧柔光视窗（浅青柠瓷绿） -->
    <rect x="25" y="32" width="70" height="38" rx="19" fill="#BFE8C4"/>

    <!-- 双眼（暖石墨深炭黑） -->
    <ellipse cx="44" cy="50" rx="5" ry="5.5" fill="#282D34"/>
    <ellipse cx="76" cy="50" rx="5" ry="5.5" fill="#282D34"/>

    <!-- 萌系微笑小嘴 -->
    <path d="M57 55 Q60 58.5 63 55" fill="none" stroke="#282D34" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 腹部柔和肚兜圆弧 -->
    <path d="M36 112 C36 96, 84 96, 84 112 Z" fill="#BFE8C4" opacity="0.95"/>
  </g>
</svg>
