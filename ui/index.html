<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA（M4.1）：不开发原生 App，「添加到主屏」覆盖移动端 90% 需求。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F2133" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Butler" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Agent Butler</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("butler.theme");
          const mode = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
