<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA（M4.1）：不开发原生 App，「添加到主屏」覆盖移动端 90% 需求。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F2133" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Butler" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Agent Butler</title>
    <!-- 主题引导外置（ui/public/theme-boot.js）：同步加载保证首帧不闪白，
         同时让 CSP 的 script-src 'self' 无需 'unsafe-inline'。 -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
