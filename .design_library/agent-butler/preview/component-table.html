<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
.specimen { max-width: 760px; }
.stage { display: block; }
.story { display: block; margin-bottom: var(--space-4); }
.story-label { display: block; font-size: var(--type-caption); font-weight: var(--font-weight-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--color-muted-foreground); margin-bottom: var(--space-2); }
.divider { border: 0; border-top: 1px solid var(--color-border); margin: var(--space-4) 0; }
/* @component-css-start */
.tbl-container { width: 100%; overflow: hidden; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--type-body); line-height: var(--line-height-body); }
.tbl thead th { text-align: left; padding: var(--space-3) var(--space-4); font-size: var(--type-caption); font-weight: var(--font-weight-caption); color: var(--color-muted-foreground); white-space: nowrap; border-bottom: 1px solid var(--color-border); }
.tbl tbody td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { filter: brightness(.97); }
.badge { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-2); border-radius: var(--radius-full); font-size: var(--type-caption); font-weight: var(--font-weight-caption); white-space: nowrap; }
.badge .dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; flex-shrink: 0; }
.badge-success { background: var(--success-100); color: var(--color-success); }
.badge-warning { background: var(--warning-100); color: var(--color-warning); }
.badge-error { background: var(--error-100); color: var(--color-error); }
.tbl-action { color: var(--color-primary); text-decoration: none; white-space: nowrap; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); }
.tbl-action:hover { background: var(--color-muted); }
.tbl-compact thead th { padding: var(--space-2) var(--space-3); }
.tbl-compact tbody td { padding: var(--space-2) var(--space-3); font-size: var(--type-caption); line-height: var(--line-height-caption); }
/* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="stage">
    <div class="story">
      <span class="story-label">默认密度</span>
      <div class="tbl-container">
        <table class="tbl">
          <thead><tr><th>名称</th><th>状态</th><th>类别</th><th>更新时间</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>消息网关</td><td><span class="badge badge-success"><span class="dot"></span>运行正常</span></td><td>消息</td><td>刚刚</td><td><a href="#" class="tbl-action">高级详情</a></td></tr>
            <tr><td>版本升级</td><td><span class="badge badge-warning"><span class="dot"></span>需检查</span></td><td>系统</td><td>2 分钟前</td><td><a href="#" class="tbl-action">立即检查</a></td></tr>
            <tr><td>安全基线</td><td><span class="badge badge-error"><span class="dot"></span>异常</span></td><td>安全</td><td>1 小时前</td><td><a href="#" class="tbl-action">修复一下</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="stage">
    <div class="story">
      <span class="story-label">紧凑密度</span>
      <div class="tbl-container">
        <table class="tbl tbl-compact">
          <thead><tr><th>时间</th><th>事件</th><th>来源</th><th>结果</th></tr></thead>
          <tbody>
            <tr><td>14:32:08</td><td>消息通知</td><td>网关</td><td>成功</td></tr>
            <tr><td>14:31:45</td><td>版本升级</td><td>系统</td><td>成功</td></tr>
            <tr><td>14:30:12</td><td>安全基线</td><td>审计</td><td>需检查</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
