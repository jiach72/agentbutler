<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="../colors_and_type.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; align-items: flex-start; gap: var(--space-2); flex-wrap: wrap; }
.label { flex-shrink: 0; min-width: 92px; padding-top: var(--space-2); font-family: var(--font-body); font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); color: var(--color-muted-foreground); letter-spacing: .05em; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
/* @component-css-start */
.sidebar { flex-shrink: 0; width: 240px; display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-3); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
.sec { padding: var(--space-2) var(--space-2) var(--space-1); font-family: var(--font-body); font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); color: var(--color-muted-foreground); letter-spacing: .04em; }
.nav-item { position: relative; display: flex; align-items: center; gap: var(--space-3); width: 100%; height: var(--size-button-height-md); padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--color-muted-foreground); text-decoration: none; font-family: var(--font-body); font-size: var(--font-size-body); font-weight: var(--font-weight-body); line-height: var(--line-height-body); white-space: nowrap; transition: background .15s, border-color .15s; }
.nav-item:hover { background: var(--color-muted); }
.nav-item.active { background: var(--primary-50); color: var(--color-primary); }
.nav-item.active::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: var(--color-primary); border-radius: var(--radius-full); }
.nav-item img { width: var(--size-icon-md); height: var(--size-icon-md); flex-shrink: 0; }
.sidebar.collapsed { width: 64px; align-items: center; padding: var(--space-3) var(--space-2); }
.sidebar.collapsed .sec { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 0; }
.sidebar.collapsed .nav-item span { display: none; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">展开</span>
  <aside class="sidebar">
    <div class="sec">控制台</div>
    <a class="nav-item active" href="#"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/activity.svg" alt=""><span>巡检</span></a>
    <a class="nav-item" href="#"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/message-square.svg" alt=""><span>消息</span></a>
    <a class="nav-item" href="#"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/package.svg" alt=""><span>版本</span></a>
    <a class="nav-item" href="#"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/sparkles.svg" alt=""><span>技能</span></a>
    <a class="nav-item" href="#"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/settings.svg" alt=""><span>设置</span></a>
  </aside>
</div>
<hr class="divider">
<div class="row"><span class="label">折叠</span>
  <aside class="sidebar collapsed">
    <div class="sec">控制台</div>
    <a class="nav-item active" href="#" aria-label="巡检"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/activity.svg" alt=""></a>
    <a class="nav-item" href="#" aria-label="消息"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/message-square.svg" alt=""></a>
    <a class="nav-item" href="#" aria-label="版本"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/package.svg" alt=""></a>
    <a class="nav-item" href="#" aria-label="技能"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/sparkles.svg" alt=""></a>
    <a class="nav-item" href="#" aria-label="设置"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/settings.svg" alt=""></a>
  </aside>
</div>
</body>
</html>
