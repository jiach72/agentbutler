<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:var(--space-3);background:var(--color-background);font-family:var(--font-family-base);color:var(--color-foreground)}
.row{display:flex;gap:var(--space-2);align-items:center;margin-bottom:var(--space-2);flex-wrap:wrap}
.label{width:92px;flex-shrink:0;font-size:var(--font-size-caption);color:var(--color-muted-foreground);white-space:nowrap}
.divider{border:none;border-top:1px solid var(--color-border);margin:var(--space-4) 0 var(--space-3)}
/* @component-css-start */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);border:1px solid transparent;border-radius:var(--radius-md);font-family:var(--font-family-base);font-size:var(--font-size-body);font-weight:600;line-height:1;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s}
.size-sm{height:var(--size-button-height-sm);min-width:var(--size-button-height-sm);padding:0 var(--space-3);font-size:var(--font-size-caption)}
.size-md{height:var(--size-button-height-md);min-width:var(--size-button-height-md);padding:0 var(--space-4)}
.size-lg{height:var(--size-button-height-lg);min-width:var(--size-button-height-lg);padding:0 var(--space-5);font-size:var(--font-size-lead)}
.btn-primary{background:var(--color-primary);color:var(--primary-foreground);border-color:var(--color-primary)}
.btn-primary:hover:not(:disabled){background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
.btn-secondary{background:var(--color-surface);color:var(--color-foreground);border-color:var(--color-border)}
.btn-secondary:hover:not(:disabled){background:var(--color-muted)}
.btn-ghost{background:transparent;color:var(--color-foreground);border-color:transparent}
.btn-ghost:hover:not(:disabled){background:var(--color-muted)}
.btn-danger{background:var(--color-error);color:var(--primary-foreground);border-color:var(--color-error)}
.btn-danger:hover:not(:disabled){filter:brightness(.92)}
.btn:disabled{background:var(--color-muted);color:var(--color-muted-foreground);border-color:var(--color-border);cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">主要操作</span><button class="btn btn-primary size-md" type="button">立即检查</button><button class="btn btn-primary size-md" type="button" disabled>立即检查</button></div>
<div class="row"><span class="label">次要操作</span><button class="btn btn-secondary size-md" type="button">高级详情</button><button class="btn btn-secondary size-md" type="button" disabled>高级详情</button></div>
<div class="row"><span class="label">幽灵操作</span><button class="btn btn-ghost size-md" type="button">消息通知</button><button class="btn btn-ghost size-md" type="button" disabled>消息通知</button></div>
<div class="row"><span class="label">危险操作</span><button class="btn btn-danger size-md" type="button">修复一下</button><button class="btn btn-danger size-md" type="button" disabled>修复一下</button></div>
<hr class="divider">
<div class="row"><span class="label">小尺寸</span><button class="btn btn-primary size-sm" type="button">运行正常</button></div>
<div class="row"><span class="label">中尺寸</span><button class="btn btn-primary size-md" type="button">版本升级</button></div>
<div class="row"><span class="label">大尺寸</span><button class="btn btn-primary size-lg" type="button">技能库</button></div>
</body>
</html>
