name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm lint
      - run: pnpm test --maxWorkers=4
      - run: pnpm build

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose file
        run: docker compose config -q
      - name: Build service images
        run: docker compose build

  hermes-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/adapters/hermes/bridge/requirements.txt
      - run: python -m pip install -r packages/adapters/hermes/bridge/requirements.txt
      - run: python -m unittest discover -s packages/adapters/hermes/bridge/tests -q
        env:
          PYTHONPATH: packages/adapters/hermes/bridge
