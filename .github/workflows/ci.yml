name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 发版门禁（release needs 它）：lint + 类型检查 + 构建 + Compose 校验。
  # 这四项覆盖语法/契约/可构建性，是发布产物的硬底线。
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm lint
      - run: pnpm build

  # 集成测试（2026-09-11 现状：9 个存量失败——updater 构建集成 4、web 网关聚合计数 2、
  # installer Windows 场景 1、UI 源码文本断言 1、install 1。均为信任层之前的历史债务，
  # 修复跟踪见 CHANGELOG；不作为发版阻塞，但保持可见不掩盖）。
  integration-tests:
    needs: [core]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --maxWorkers=4

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose file
        run: docker compose config -q
      - name: Build service images
        run: docker compose build

  hermes-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/adapters/hermes/bridge/requirements.txt
      - run: python -m pip install -r packages/adapters/hermes/bridge/requirements.txt
      - run: python -m unittest discover -s packages/adapters/hermes/bridge/tests -q
        env:
          # fixture/hermes_runtime 里有 hermes_hooks 延迟导入的 gateway 包（run.py），
          # 不加进路径则 CI 上 12 个用例 ModuleNotFoundError（历史遗留）。
          PYTHONPATH: packages/adapters/hermes/bridge:packages/adapters/hermes/bridge/tests/fixtures/hermes_runtime

  # 发版：推 v 前缀 tag 触发（如 v0.1-beta.260911.42）。
  # 版本末段（构建号）用 CI run.number 覆写——本地 set 的值只是占位，
  # 发布产物永远以本次流水线号为准（同一小时多次发布也可区分）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, docker-compose, hermes-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 解析 tag 版本并覆写构建号为流水线号
        run: |
          # v0.1-beta.260911.13（显示形态）→ 0.1.0-beta.260911.<run_number>（存储形态 SemVer）
          BASE="${TAG_VERSION#v}"                  # 0.1-beta.260911.13
          PREFIX="${BASE%.*}"                      # 0.1-beta.260911
          FULL="0.1.0-${PREFIX#0.1-}.${GITHUB_RUN_NUMBER}"
          node scripts/version.mjs set "$FULL"
          echo "RELEASE_VERSION=$FULL" >> "$GITHUB_ENV"
          echo "发布版本: $FULL（tag $TAG_VERSION，构建号=$GITHUB_RUN_NUMBER）"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          body: |
            Agent Butler ${{ env.RELEASE_VERSION }}

            版本规则：`0.1-beta.YYMMDD.构建号`
            - `YYMMDD` — UTC 日期
            - `构建号` — 本次 CI 流水线号（run #${{ github.run_number }}）
            - tag 形态：`v0.1-beta.YYMMDD.x`（v 前缀仅用于触发发版）

            已通过质量门：lint / tsc / build / compose 校验 / bridge 单测。
            Docker 镜像由部署机 `docker compose build` 自行构建。
          draft: false
          prerelease: true
