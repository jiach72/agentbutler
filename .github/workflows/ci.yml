name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 发版门禁（release needs 它）：lint + 类型检查 + 构建 + Compose 校验。
  # 这四项覆盖语法/契约/可构建性，是发布产物的硬底线。
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm lint
      - run: pnpm build

  # 集成测试：发版硬门禁。历史 9 个存量失败已清账（2026-09-22）；
  # 再失败不得 continue-on-error 放行。
  integration-tests:
    needs: [core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --maxWorkers=4

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose file
        run: docker compose config -q
      - name: Build service images
        run: docker compose build

  hermes-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/adapters/hermes/bridge/requirements.txt
      - run: python -m pip install -r packages/adapters/hermes/bridge/requirements.txt
      - run: python -m unittest discover -s packages/adapters/hermes/bridge/tests -q
        env:
          # fixture/hermes_runtime 里有 hermes_hooks 延迟导入的 gateway 包（run.py），
          # 不加进路径则 CI 上 12 个用例 ModuleNotFoundError（历史遗留）。
          PYTHONPATH: packages/adapters/hermes/bridge:packages/adapters/hermes/bridge/tests/fixtures/hermes_runtime

  # 发版：推 v 前缀 tag 触发（如 v0.1-beta.260911.42）。
  # 版本末段（构建号）用 CI run.number 覆写——本地 set 的值只是占位，
  # 发布产物永远以本次流水线号为准（同一小时多次发布也可区分）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, docker-compose, hermes-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 解析 tag 版本并更新版本
        run: |
          BASE="${TAG_VERSION#v}"
          if [[ "$BASE" =~ ^0\.1-beta\. ]]; then
            PREFIX="${BASE%.*}"
            FULL="0.1.0-${PREFIX#0.1-}.${GITHUB_RUN_NUMBER}"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            FULL="$BASE"
            if [[ "$BASE" == *"-"* ]]; then
              echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            else
              echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          fi
          node scripts/version.mjs set "$FULL"
          echo "RELEASE_VERSION=$FULL" >> "$GITHUB_ENV"
          echo "发布版本: $FULL（tag $TAG_VERSION）"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          body: |
            Agent Butler ${{ env.RELEASE_VERSION }}

            已通过质量门：lint / tsc / build / compose 校验 / bridge 单测。
            Docker 镜像由部署机 `docker compose build` 自行构建。
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
