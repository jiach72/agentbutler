name: agent-butler

# 三容器统一日志轮转，避免 docker logs 无上限增长吃满磁盘。
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  butler-gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    # 显式镜像名便于按版本回滚；生产部署应使用不可变版本标签而非 latest。
    image: agent-butler-butler-gateway:${BUTLER_VERSION:-latest}
    environment:
      BUTLER_HOME: /home/butler
      BUTLER_GATEWAY_HOST: 0.0.0.0
      BUTLER_GATEWAY_PORT: 7532
      BUTLER_GATEWAY_PACE_SEC: ${BUTLER_GATEWAY_PACE_SEC:-30}
      BUTLER_ENABLE_HERMES_MESSAGE_RUNTIME: ${BUTLER_ENABLE_HERMES_MESSAGE_RUNTIME:-auto}
      # 配置齐全时 Gateway 会自动接入 Hermes Bridge；Bridge 暂时离线不会拖垮 Gateway。
      # Bridge 仅监听宿主 loopback 时（如 WSL 原生 Docker），使用 bridge-forward
      # profile，并把此值设为 http://host.docker.internal:8755。
      BUTLER_HERMES_BRIDGE_URL: ${BUTLER_HERMES_BRIDGE_URL:-}
      BUTLER_HERMES_INSTANCE_ID: ${BUTLER_HERMES_INSTANCE_ID:-hermes-main}
      BUTLER_HERMES_ROOT: /home/butler/hermes
      BUTLER_HERMES_BRIDGE_TOKEN_FILE: ${BUTLER_HERMES_BRIDGE_TOKEN_FILE:-/home/butler/hermes/agent-butler/bridge.token}
      BUTLER_MESSAGE_PROJECTION_DB: ${BUTLER_MESSAGE_PROJECTION_DB:-/home/butler/data/messages.sqlite}
      BUTLER_HERMES_BRIDGE_ALLOW_NON_LOOPBACK: ${BUTLER_HERMES_BRIDGE_ALLOW_NON_LOOPBACK:-false}
      BUTLER_MESSAGE_REQUEST_TIMEOUT_MS: ${BUTLER_MESSAGE_REQUEST_TIMEOUT_MS:-120000}
      BUTLER_MESSAGE_POLL_INTERVAL_MS: ${BUTLER_MESSAGE_POLL_INTERVAL_MS:-1000}
      BUTLER_MESSAGE_STOP_TIMEOUT_MS: ${BUTLER_MESSAGE_STOP_TIMEOUT_MS:-5000}
      BUTLER_TELEGRAM_BOT_TOKEN: ${BUTLER_TELEGRAM_BOT_TOKEN:-}
      BUTLER_TELEGRAM_CHAT_ID: ${BUTLER_TELEGRAM_CHAT_ID:-}
      BUTLER_BARK_DEVICE_KEY: ${BUTLER_BARK_DEVICE_KEY:-}
      BUTLER_BARK_SERVER: ${BUTLER_BARK_SERVER:-}
      BUTLER_SERVERCHAN_SENDKEY: ${BUTLER_SERVERCHAN_SENDKEY:-}
      BUTLER_SMTP_HOST: ${BUTLER_SMTP_HOST:-}
      BUTLER_SMTP_PORT: ${BUTLER_SMTP_PORT:-}
      BUTLER_SMTP_USER: ${BUTLER_SMTP_USER:-}
      BUTLER_SMTP_PASS: ${BUTLER_SMTP_PASS:-}
      BUTLER_SMTP_FROM: ${BUTLER_SMTP_FROM:-}
      BUTLER_SMTP_TO: ${BUTLER_SMTP_TO:-}
      # 网关能读全部消息正文并改策略；配置口令后所有业务路由要求鉴权（/healthz 与
      # /internal/hermes/* 豁免，后者单独限速）。Web 代理会自动携带同一口令。
      BUTLER_ACCESS_TOKEN: ${BUTLER_ACCESS_TOKEN:-}
    expose:
      - "7532"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - butler-data:/home/butler
      - ${BUTLER_HERMES_HOST_PATH:-./.runtime/hermes}:/home/butler/hermes:ro
    logging: *default-logging
    restart: unless-stopped

  butler-watch:
    build:
      context: .
      dockerfile: apps/watch/Dockerfile
    image: agent-butler-butler-watch:${BUTLER_VERSION:-latest}
    environment:
      BUTLER_HOME: /home/butler
      BUTLER_FRAMEWORK: ${BUTLER_FRAMEWORK:-hermes}
      BUTLER_WATCH_HOST: 0.0.0.0
      BUTLER_WATCH_PORT: 7533
      # Watch 在容器内必须监听 0.0.0.0 才能被 Web 访问；凭据写入权限单独控制。
      # Watch 仅暴露在 Compose 内网；Web 的访问口令与同源校验保护写请求。
      # 本机默认可写，发布到不可信网络时应在 .env 显式设为 false。
      BUTLER_CREDENTIAL_WRITES_ALLOWED: ${BUTLER_CREDENTIAL_WRITES_ALLOWED:-true}
      BUTLER_GATEWAY_URL: http://butler-gateway:7532
      BUTLER_AUTO_START: ${BUTLER_AUTO_START:-true}
      BUTLER_HERMES_ROOT: /home/butler/hermes
      BUTLER_HERMES_EXTERNAL_RUNTIME: "true"
      BUTLER_HERMES_READ_ONLY: "true"
      # AES-256-GCM 主密钥仅注入 Watch；缺失时凭据库 fail-closed。
      BUTLER_SECRET_MASTER_KEY: ${BUTLER_SECRET_MASTER_KEY:-}
      # 候选、日志和引擎副本始终写 Butler 数据卷，不写 Hermes checkout。
      BUTLER_EVOLUTION_RUN_ROOT: /home/butler/evolution-runs
      HERMES_ROOT: /home/butler/hermes
      BUTLER_OPENCLAW_ROOT: /home/butler/openclaw
      OPENCLAW_HOME: /home/butler/openclaw
      BUTLER_REPOSITORY_URL: ${BUTLER_REPOSITORY_URL:-https://github.com/jiach72/agentbutler}
      OPENCLAW_GATEWAY_HOST: ${OPENCLAW_GATEWAY_HOST:-host.docker.internal}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      BUTLER_HERMES_API_HOST: ${BUTLER_HERMES_API_HOST:-host.docker.internal}
      BUTLER_HERMES_API_PORT: ${BUTLER_HERMES_API_PORT:-8642}
      # WSL 容器通过受限宿主控制桥执行 Hermes start/stop/restart；不暴露任意终端。
      BUTLER_HERMES_CONTROL_URL: ${BUTLER_HERMES_CONTROL_URL:-}
      BUTLER_HERMES_CONTROL_TOKEN_FILE: ${BUTLER_HERMES_CONTROL_TOKEN_FILE:-/home/butler/hermes/agent-butler/control.token}
      BUTLER_UPDATER_URL: http://butler-updater:7540
      # 与 updater 共享同一份访问口令；Watch 转发自更新请求时需要带上。
      BUTLER_ACCESS_TOKEN: ${BUTLER_ACCESS_TOKEN:-}
      # Optional GitHub token for higher API limits when staging recommended skills.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      butler-gateway:
        condition: service_healthy
      butler-updater:
        condition: service_healthy
    expose:
      - "7533"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - butler-data:/home/butler
      # WSL Docker 对同一 bind 源的嵌套挂载会遮蔽父目录；保持单一完整挂载，
      # promote 由 Watch 的路径限制、baseline hash 和一次性 token 门禁保护。
      - ${BUTLER_HERMES_HOST_PATH:-./.runtime/hermes}:/home/butler/hermes:rw
      - ${BUTLER_OPENCLAW_HOST_PATH:-./.runtime/openclaw}:/home/butler/openclaw:ro
      # Docker control is opt-in. Set DOCKER_SOCKET_PATH to enable it.
      - ${DOCKER_SOCKET_PATH:-/dev/null}:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    logging: *default-logging
    restart: unless-stopped

  butler-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: agent-butler-butler-web:${BUTLER_VERSION:-latest}
    environment:
      BUTLER_HOME: /home/butler
      # 容器内监听全部网卡是必需的（Compose 网络的端口转发），安全边界由
      # BUTLER_ACCESS_TOKEN 与发布地址 BUTLER_WEB_PUBLISH_HOST 共同承担。
      BUTLER_WEB_HOST: 0.0.0.0
      # 宿主机实际发布地址。安全自检与侧栏状态使用它，而不是容器内部监听地址。
      BUTLER_WEB_PUBLISH_HOST: ${BUTLER_WEB_PUBLISH_HOST:-127.0.0.1}
      BUTLER_WEB_PORT: 7531
      BUTLER_GATEWAY_URL: http://butler-gateway:7532
      BUTLER_WATCH_URL: http://butler-watch:7533
      # 面板发布到非回环地址时必填；留空则只允许本机访问。
      BUTLER_ACCESS_TOKEN: ${BUTLER_ACCESS_TOKEN:-}
    depends_on:
      butler-gateway:
        condition: service_healthy
      butler-watch:
        condition: service_healthy
    ports:
      # Default expansion is 127.0.0.1:7531:7531; override with .env when needed.
      - "${BUTLER_WEB_PUBLISH_HOST:-127.0.0.1}:${BUTLER_WEB_PORT:-7531}:7531"
    volumes:
      - butler-data:/home/butler
    logging: *default-logging
    restart: unless-stopped

  # 生产容器没有 .git；updater 挂载宿主工作树，独立完成拉取、构建、重启和回滚。
  # 不发布宿主端口，只在 Compose 内网向 butler-watch 提供控制接口。
  butler-updater:
    build:
      context: .
      dockerfile: apps/updater/Dockerfile
    image: agent-butler-butler-updater:${BUTLER_VERSION:-latest}
    environment:
      BUTLER_HOME: /home/butler
      BUTLER_UPDATER_HOST: 0.0.0.0
      BUTLER_UPDATER_PORT: 7540
      BUTLER_UPDATER_SOURCE: /workspace
      BUTLER_COMPOSE_PROJECT_DIR: /workspace
      BUTLER_COMPOSE_BIN: docker
      BUTLER_REPOSITORY_URL: ${BUTLER_REPOSITORY_URL:-https://github.com/jiach72/agentbutler}
      BUTLER_UPDATER_SERVICES: butler-gateway butler-watch butler-web
      # 必填。updater 会执行 git checkout、重建镜像、重启服务，没有口令时它拒绝一切请求。
      BUTLER_ACCESS_TOKEN: ${BUTLER_ACCESS_TOKEN:-}
    expose:
      - "7540"
    volumes:
      - butler-data:/home/butler
      - ${BUTLER_REPOSITORY_PATH:-.}:/workspace:rw
      # Docker Socket 默认关闭。显式设置 BUTLER_UPDATER_DOCKER_SOCKET=/var/run/docker.sock
      # 后 updater 才能重建并重启服务；访问口令不是 Docker Socket 的替代安全边界。
      - ${BUTLER_UPDATER_DOCKER_SOCKET:-/dev/null}:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    logging: *default-logging
    restart: unless-stopped

  # 可选：Hermes Bridge 只监听宿主 loopback 时，用它把 8755 转发到 127.0.0.1:8754。
  # 启用：docker compose --profile bridge-forward up -d
  # 链路：gateway → host.docker.internal:8755 →（host 网络）127.0.0.1:8754
  # 8755 是未鉴权的 TCP 转发入口，应由宿主防火墙限制为本机/Docker 网段。
  butler-bridge-forwarder:
    image: alpine/socat:latest
    network_mode: host
    command: tcp-listen:8755,fork,reuseaddr tcp:127.0.0.1:8754
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - bridge-forward

  # WSL 原生 Docker 无法直接访问宿主 systemd --user；控制桥只接受固定白名单动作。
  # 宿主 bridge 监听 127.0.0.1:8756，本转发器仅把容器内访问转到宿主 loopback。
  hermes-control-forwarder:
    image: alpine/socat:latest
    network_mode: host
    command: tcp-listen:8757,fork,reuseaddr tcp:127.0.0.1:8756
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - hermes-control-forward

volumes:
  butler-data:
    name: ${BUTLER_DATA_VOLUME:-agent-butler-data}
